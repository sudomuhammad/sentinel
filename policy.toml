# Sentinel policy. Anything not allowed here is denied.

[agent]
# "anthropic" runs Claude through the Agent SDK.
# "openai" runs a small tool loop on OpenAI's Responses API.
# Override per run with `sentinel --provider ...`.
provider = "openai"

[agent.anthropic]
model = "claude-opus-5-5"
reader_model = "claude-opus-5-5"
reviewer_model = "claude-opus-5-5"

[agent.openai]
# The reader only writes a short JSON summary, so it gets the cheapest model in [pricing].
# The reviewer has to spot harmful code, so it gets a stronger one.
model = "gpt-6-luna"
reader_model = "gpt-5-nano"
reviewer_model = "gpt-5-mini"

[review]
# A tool-less model reads each diff before the gate. It can approve, send feedback back to the
# coder (up to max_rounds coder runs in all) or reject the run. Approval never skips the gate.
enabled = true
max_rounds = 2

[budget]
max_turns = 60
# The proxy prices every model response with [pricing] and halts the run past this amount.
# Claude runs are also capped by the Agent SDK. The host-side reader isn't counted.
max_budget_usd = 1.0
timeout_seconds = 1200
# The proxy halts the run after this many requests.
max_requests = 3000

[pricing]
# US$ per million tokens, [input, output]. Calls to a model not listed here are refused.
"gpt-5-nano" = [0.05, 0.40]
"gpt-6-luna" = [0.10, 0.50]
"gpt-5-mini" = [0.25, 2.00]
"gpt-6.1-terra" = [1.00, 5.00]
"claude-haiku-5-5" = [0.10, 0.50]
"claude-sonnet-5-5" = [2.00, 10.00]
"claude-opus-5-5" = [4.00, 20.00]

[packages]
npm_registry = "registry.npmjs.org"
pypi_index = "pypi.org"
pypi_files = "files.pythonhosted.org"
# npm versions and PyPI files published more recently than this are hidden and refused.
min_age_days = 7
# Optional allowlists. Empty means any package that passes the age check.
npm_allow = []
pypi_allow = []

[shipout]
branch_prefix = "agent/"
max_changed_files = 100
# Changes to these paths are never shipped. fnmatch syntax; "*" also matches "/".
deny_paths = [".github/*", ".gitmodules", "CODEOWNERS", "*/CODEOWNERS", ".claude/*", ".mcp.json"]
# Changes to dependency manifests and lockfiles (matched by file name) aren't shipped unless
# this is true, so a new or changed dependency always reaches a person first.
allow_dependency_changes = false
dependency_files = [
    "package.json", "package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml",
    "requirements*.txt", "constraints*.txt", "pyproject.toml", "uv.lock", "poetry.lock",
    "Pipfile", "Pipfile.lock", "setup.py", "setup.cfg",
]

# Egress allowlist. Each rule names a host, the methods and path patterns allowed on it,
# and optionally a credential the proxy adds. The sandbox never sees that credential.
# A rule tagged with a provider is only active when that provider is in use.

[[egress]]
host = "api.anthropic.com"
provider = "anthropic"
methods = ["GET", "POST"]
paths = ["/v1/messages*", "/v1/models*"]
inject = { header = "x-api-key", env = "ANTHROPIC_API_KEY" }
# Conversation bodies hold whatever the agent has read, including canary values from env.
# That is not exfiltration, so only headers and URLs are scanned on this host.
scan_body = false

[[egress]]
host = "api.openai.com"
provider = "openai"
methods = ["POST"]
paths = ["/v1/responses*"]
inject = { header = "authorization", env = "OPENAI_API_KEY", prefix = "Bearer " }
scan_body = false

[[egress]]
host = "registry.npmjs.org"
methods = ["GET", "HEAD"]

[[egress]]
host = "pypi.org"
methods = ["GET", "HEAD"]
paths = ["/simple/*", "/pypi/*/json"]

[[egress]]
host = "files.pythonhosted.org"
methods = ["GET", "HEAD"]
paths = ["/packages/*"]
